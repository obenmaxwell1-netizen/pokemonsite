<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Register — Pokepluse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<!-- Google Translate Widget -->
<div style="position: absolute; top: 1rem; right: 1rem; z-index: 100;">
  <div id="google_translate_element"></div>
</div>
<div class="auth-page">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:1.75rem;">
      <a href="index.html" class="nav-logo" style="font-size:1.75rem;">⚡ Pokepluse</a>
      <p style="color:var(--text-secondary);margin-top:0.5rem;font-size:0.9rem;">Your premier TCG destination</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password" required/>
      </div>
      <div id="login-error" style="color:var(--red);font-size:0.85rem;margin-bottom:1rem;display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn">
        <i class="fa fa-sign-in-alt"></i> Login
      </button>
    </form>

    <!-- Signup -->
    <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters" required minlength="6"/>
      </div>
      <div id="signup-error" style="color:var(--red);font-size:0.85rem;margin-bottom:1rem;display:none;"></div>
      <div id="signup-success" style="color:var(--green);font-size:0.85rem;margin-bottom:1rem;display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="signup-btn">
        <i class="fa fa-user-plus"></i> Create Account
      </button>
    </form>

    <div style="text-align:center;margin-top:1.5rem;">
      <a href="index.html" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none;">← Back to Store</a>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cart.js"></script>
<script>
  function switchTab(tab) {
    document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
    document.getElementById('signup-form').style.display = tab==='signup' ? 'block' : 'none';
    document.getElementById('tab-login').className = 'auth-tab' + (tab==='login'?' active':'');
    document.getElementById('tab-signup').className = 'auth-tab' + (tab==='signup'?' active':'');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';
    errEl.style.display = 'none';
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
    if (error) {
      errEl.textContent = error.message; errEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fa fa-sign-in-alt"></i> Login';
    } else {
      window.location.href = 'index.html';
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    const errEl = document.getElementById('signup-error');
    const succEl = document.getElementById('signup-success');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating account...';
    errEl.style.display = 'none'; succEl.style.display = 'none';
    const { error } = await supabase.auth.signUp({
      email: document.getElementById('signup-email').value,
      password: document.getElementById('signup-password').value,
      options: { data: { full_name: document.getElementById('signup-name').value } }
    });
    if (error) {
      errEl.textContent = error.message; errEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fa fa-user-plus"></i> Create Account';
    } else {
      succEl.textContent = 'Account created! Check your email to confirm, then login.';
      succEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="fa fa-user-plus"></i> Create Account';
    }
  }

  // Redirect if already logged in
  supabase.auth.getUser().then(({data:{user}})=>{ if(user) window.location.href='index.html'; });
</script>

<!-- Google Translate Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
