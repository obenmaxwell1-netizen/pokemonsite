<div class="container" style="padding-top: 120px; padding-bottom: 80px; min-height: 80vh;">
  <div style="max-width: 600px; margin: 0 auto; text-align: center;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Track Your Order</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2.5rem; font-size: 1.1rem;">Enter your Order ID and Email Address to see the current status of your order.</p>

    <div class="glass-card" style="padding: 2.5rem; text-align: left; margin-bottom: 2rem;">
      <div class="form-group">
        <label for="track-id">Tracking ID (Order ID)</label>
        <input type="text" id="track-id" placeholder="e.g. 550e8400-e29b-..." style="padding: 14px; font-family: monospace;">
      </div>
      <div class="form-group" style="margin-top: 1.5rem;">
        <label for="track-email">Email Address</label>
        <input type="email" id="track-email" placeholder="your@email.com" style="padding: 14px;">
      </div>
      <button class="btn btn-gold" style="width: 100%; justify-content: center; font-size: 1rem; margin-top: 1.5rem; padding: 16px;" id="track-btn" onclick="trackOrder()">
        <i class="fa fa-search"></i> Track Order
      </button>
    </div>

    <div id="track-result" style="text-align: left; display: none;"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Supabase & Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cart.js"></script>
<script>
  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  async function trackOrder() {
    const orderId = document.getElementById('track-id').value.trim();
    const email = document.getElementById('track-email').value.trim();
    const btn = document.getElementById('track-btn');
    const resultDiv = document.getElementById('track-result');

    if (!orderId || !email) {
      showToast('âŒ Please enter both Tracking ID and Email.', 'error');
      return;
    }

    // Basic UUID format check (optional but good for UX)
    if (orderId.length < 10) {
      showToast('âŒ Invalid Tracking ID format.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Searching...';
    resultDiv.style.display = 'none';

    try {
      const { data, error } = await supabase
        .from('orders')
        .select('*')
        .eq('id', orderId)
        .eq('user_email', email)
        .single();

      if (error || !data) {
        showToast('âŒ Order not found. Check your ID and Email.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-search"></i> Track Order';
        return;
      }

      // Render Order Details
      const date = new Date(data.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
      const statusClassMap = {
        'pending': 'status-pending',
        'confirmed': 'status-confirmed',
        'payment done': 'status-payment-done',
        'shipping now': 'status-shipping-now',
        'cancelled': 'status-cancelled'
      };
      const statusClass = statusClassMap[data.status?.toLowerCase()] || 'status-pending';

      let itemsHtml = '';
      if (data.items && data.items.length) {
        itemsHtml = '<ul style="margin: 1rem 0; padding-left: 1.25rem; font-size: 0.95rem; color: var(--text-secondary); line-height: 1.8;">';
        data.items.forEach(item => {
          itemsHtml += `<li><strong>${item.qty}x</strong> ${item.name} - $${Number(item.price).toFixed(2)}</li>`;
        });
        itemsHtml += '</ul>';
      }

      resultDiv.innerHTML = `
        <div class="glass-card" style="padding: 2rem;">
          <h2 style="font-size: 1.5rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-glass);">Order Details</h2>
          
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Status</div>
              <div class="status-badge ${statusClass}" style="margin-top: 0.5rem; font-size: 1rem; padding: 6px 16px;">${data.status.toUpperCase()}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Date</div>
              <div style="margin-top: 0.5rem; font-weight: 600;">${date}</div>
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <div style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">Items</div>
            ${itemsHtml}
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 1.5rem; border-top: 1px solid var(--border-glass);">
            <span style="font-size: 1.1rem; font-weight: 600;">Total</span>
            <span style="font-size: 1.5rem; font-weight: 800; color: var(--gold);">$${Number(data.total_price).toFixed(2)}</span>
          </div>
        </div>
      `;
      
      resultDiv.style.display = 'block';

    } catch (e) {
      showToast('âŒ System error. Please try again later.', 'error');
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-search"></i> Track Order';
  }
</script>
