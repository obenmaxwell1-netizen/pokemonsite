<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Inquiries — Pokepluse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .inquiry-card { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.25rem; transition: var(--transition); }
    .inquiry-card:hover { border-color: rgba(59,130,246,0.3); }
    .inquiry-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .inquiry-id { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
    .status-badge { padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: rgba(245,158,11,0.15); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
    .status-confirmed { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .status-cancelled { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .inquiry-items { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .inq-item { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border-glass); }
    .inq-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">⚡ Pokepluse</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="catalog.html">Shop</a></li>
    <li><a href="my-inquiries.html" style="color:var(--blue-light);">My Inquiries</a></li>
    <li id="nav-auth-area"></li>
  </ul>
  <div class="nav-actions">
    <!-- Google Translate Widget -->
    <div id="google_translate_element"></div>
    <a href="cart.html" class="cart-icon">
      <i class="fa fa-shopping-bag"></i>
      <span class="cart-badge" id="cart-count" style="display:none;">0</span>
    </a>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
      <i class="fa fa-bars"></i>
    </button>
  </div>
</nav>

<div class="page-header">
  <h1>My Inquiries</h1>
  <p>Track all your product inquiry submissions</p>
</div>

<section class="section">
  <div class="container" style="max-width:800px;">
    <div id="inquiries-container">
      <div class="skeleton" style="height:180px;border-radius:var(--radius-lg);margin-bottom:1rem;"></div>
      <div class="skeleton" style="height:180px;border-radius:var(--radius-lg);margin-bottom:1rem;"></div>
    </div>
  </div>
</section>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  async function loadInquiries() {
    const { data: { user } } = await supabase.auth.getUser();
    const container = document.getElementById('inquiries-container');

    if (!user) {
      container.innerHTML = `<div style="text-align:center;padding:4rem 2rem;">
        <div style="font-size:3rem;margin-bottom:1rem;">🔒</div>
        <h3>Login to view your inquiries</h3>
        <a href="auth.html" class="btn btn-primary" style="margin-top:1rem;">Login / Register</a>
      </div>`;
      return;
    }

    const { data, error } = await supabase.from('orders').select('*').eq('user_id', user.id).order('created_at', {ascending:false});

    if (error || !data?.length) {
      container.innerHTML = `<div style="text-align:center;padding:4rem 2rem;">
        <div style="font-size:3rem;margin-bottom:1rem;">📋</div>
        <h3>No inquiries yet</h3>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">Start shopping and submit your first inquiry!</p>
        <a href="catalog.html" class="btn btn-primary">Browse Products</a>
      </div>`;
      return;
    }

    container.innerHTML = data.map(order => {
      const statusClass = `status-${order.status}`;
      const items = order.items || [];
      const date = new Date(order.created_at).toLocaleDateString('en-US', {year:'numeric',month:'short',day:'numeric'});
      return `
        <div class="inquiry-card">
          <div class="inquiry-header">
            <div>
              <div style="font-weight:700;margin-bottom:0.25rem;">Inquiry #${order.id.substring(0,8).toUpperCase()}</div>
              <div class="inquiry-id">${date} · ${order.payment_method || 'N/A'}</div>
            </div>
            <span class="status-badge ${statusClass}">${order.status}</span>
          </div>
          <div class="inquiry-items">
            ${items.map(i=>`
              <div class="inq-item">
                <span style="color:var(--text-secondary);">${i.name} ×${i.qty||1}</span>
                <span>$${((i.qty||1)*i.price).toFixed(2)}</span>
              </div>`).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:0.75rem;border-top:1px solid var(--border-glass);">
            <span style="font-size:0.85rem;color:var(--text-muted);">${items.length} item${items.length!==1?'s':''}</span>
            <span style="font-weight:800;color:var(--gold);">$${Number(order.total_price).toFixed(2)}</span>
          </div>
        </div>`;
    }).join('');
  }

  loadInquiries();
</script>

<!-- Google Translate Script -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
