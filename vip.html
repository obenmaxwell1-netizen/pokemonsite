<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VIP Vault &mdash; Pok&eacute;mon Center</title>
  <meta name="description" content="Request access to the exclusive VIP Vault for ultra-rare Pok&eacute;mon and One Piece TCG drops."/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { background-color: #050505; }
    .vip-hero { padding: 12rem 2rem 4rem; text-align: center; max-width: 700px; margin: 0 auto; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
    
    .lock-icon { font-size: 3.5rem; color: var(--gold); margin-bottom: 2rem; filter: drop-shadow(0 0 20px rgba(212, 175, 55,0.5)); animation: pulseLock 2s infinite; }
    @keyframes pulseLock { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }

    .vip-hero h1 { font-size: 4rem; font-weight: 900; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(135deg, #ffffff, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .vip-hero p { color: var(--text-secondary); font-size: 1.2rem; line-height: 1.8; margin-bottom: 3rem; }
    
    .vip-form-container { width: 100%; max-width: 500px; }
    .vip-form-group { display: flex; flex-direction: column; gap: 1rem; }
    .vip-input { padding: 1.2rem 1.5rem; background: rgba(20,20,25,0.8); border: 1px solid rgba(212, 175, 55,0.3); border-radius: var(--radius-md); color: white; font-size: 1rem; text-align: center; letter-spacing: 1px; transition: var(--transition); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
    .vip-input:focus { outline: none; border-color: var(--gold); background: rgba(25,25,35,0.9); box-shadow: 0 0 20px rgba(212, 175, 55,0.2), inset 0 2px 10px rgba(0,0,0,0.5); }
    
    .btn-vip { background: linear-gradient(135deg, var(--gold), #997a00); border: none; padding: 1.2rem; font-size: 1.1rem; font-weight: 700; color: #000; border-radius: var(--radius-md); cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: var(--transition); box-shadow: 0 10px 20px rgba(212, 175, 55,0.3); }
    .btn-vip:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55,0.4); }

    .vip-bg { position: fixed; inset: 0; background: url('dark.webp') center/cover no-repeat; opacity: 0.15; z-index: 0; pointer-events: none; filter: grayscale(100%) contrast(1.2); }
    .vip-overlay { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0%, #050505 80%); z-index: 1; pointer-events: none; }
  </style>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
</head>
<body>
<div class="vip-bg"></div>
<div class="vip-overlay"></div>

<!-- NAVBAR -->
<nav class="navbar" style="background: transparent; border-bottom: none;">
  <a href="index.html" class="nav-logo" style="z-index: 100;"><img src="logo.jpeg" alt="Pok&eacute;mon Center" class="premium-logo-img"> <span class="premium-logo-text">Pok&eacute;mon Center</span></a>
  <ul class="nav-links" style="z-index: 100;">
    <li><a href="index.html">Home</a></li>
    <li><a href="catalog.html">All Products</a></li>
    <li><a href="bounty.html">Bounty Board</a></li>
    <li><a href="vip.html" style="color:var(--gold);">VIP Vault</a></li>
  </ul>
</nav>

<div class="vip-hero">
  <i class="fa fa-lock lock-icon"></i>
  <h1>The VIP Vault</h1>
  <p>Our most exclusive and highest-value inventory is hidden. To view ultra-rare graded cards, vintage booster boxes, and secret drops, request access below.</p>
  
  <div class="vip-form-container">
    <form id="vip-request-form" class="vip-form-group">
      <input type="email" id="vip-email" class="vip-input" placeholder="ENTER YOUR EMAIL ADDRESS" required>
      <button type="submit" id="btn-request" class="btn-vip"><i class="fa fa-key" style="margin-right: 8px;"></i> Request Access</button>
    </form>

    <div style="margin-top: 2rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <div style="height: 1px; background: rgba(255,255,255,0.1); width: 50px;"></div>
      <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Already have a passcode?</span>
      <div style="height: 1px; background: rgba(255,255,255,0.1); width: 50px;"></div>
    </div>

    <form id="vip-passcode-form" style="margin-top: 1rem;">
      <div style="display: flex; gap: 0.5rem;">
        <input type="password" id="vip-passcode" class="vip-input" style="flex: 1; letter-spacing: 3px;" placeholder="ENTER PASSCODE" required>
        <button type="submit" id="btn-passcode" class="btn-vip" style="padding: 0 1.5rem;"><i class="fa fa-arrow-right"></i></button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  // Handle Request Access
  document.getElementById('vip-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('vip-email').value.trim();
    if (!email) return;
    
    const btn = document.getElementById('btn-request');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Processing...';

    // Insert into vip_requests
    const { error } = await supabase.from('vip_requests').insert({ email, status: 'pending' });

    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-key" style="margin-right: 8px;"></i> Request Access';

    if (error) {
      alert('Error requesting access. Please try again.');
    } else {
      alert('Access Request Received. If approved, you will receive a one-time passcode via email within 48 hours.');
      document.getElementById('vip-request-form').reset();
    }
  });

  // Handle Passcode Entry
  document.getElementById('vip-passcode-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const passcode = document.getElementById('vip-passcode').value.trim();
    if (!passcode) return;

    const btn = document.getElementById('btn-passcode');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

    const { data, error } = await supabase.from('vip_requests')
      .select('*')
      .eq('passcode', passcode)
      .eq('status', 'granted')
      .single();

    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-arrow-right"></i>';

    if (error || !data) {
      alert('Invalid Passcode. Please request access or contact support.');
    } else {
      // Store VIP access in sessionStorage
      sessionStorage.setItem('vip_access', 'true');
      window.location.href = 'vault.html';
    }
  });
</script>
</body>
</html>
