<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart &amp; Checkout &ndash; Pokepluse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .cart-page { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; align-items: start; padding: 8rem 2rem 4rem; max-width: 1100px; margin: 0 auto; }
    .cart-panel { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); overflow: hidden; }
    .cart-panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-glass); font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .cart-items-list { padding: 0.5rem 0; }
    .qty-control { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-glass); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .qty-btn:hover { background: var(--blue); border-color: var(--blue); }
    .qty-num { font-weight: 700; min-width: 20px; text-align: center; }
    .order-summary { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 1.5rem; position: sticky; top: 90px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; }
    .summary-row.total { border-top: 1px solid var(--border-glass); padding-top: 1rem; margin-top: 0.5rem; font-weight: 800; font-size: 1.1rem; }
    .summary-row.total span:last-child { color: var(--gold); }
    .empty-cart { text-align: center; padding: 4rem 2rem; }
    @media (max-width: 768px) { .cart-page { grid-template-columns: 1fr; padding: 6rem 1rem 3rem; } .order-summary { position: static; } }

    /* === Payment Logo Card Picker === */
    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 480px) { .pay-grid { grid-template-columns: repeat(2, 1fr); } }
    .pay-card {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.75rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
      background: #fff;
      user-select: none;
      min-height: 58px;
    }
    .pay-card:hover {
      border-color: #D4AF37;
      background: #fffbf0;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(212,175,55,0.15);
    }
    .pay-card.selected {
      border-color: #D4AF37;
      background: #fffbf0;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.25);
    }
    .pay-card.selected .pay-name { color: #92670a; font-weight: 700; }
    /* Logo box: clean white container, like Stripe payment forms */
    .pay-logo {
      width: 48px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #e8e8e8;
      border-radius: 7px;
      padding: 4px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }
    .pay-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .pay-logo svg {
      width: 100%;
      height: 100%;
    }
    .pay-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      line-height: 1.2;
      white-space: nowrap;
    }
    .pay-card.selected::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free'; font-weight: 900;
      font-size: 0.7rem; color: #D4AF37;
      margin-left: auto;
    }
  </style>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
</head>

</nav>

<script src="js/cart.js"></script>
<script>
  const ORDER_EMAIL = 'contact@pokepluse.com';

  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById('cart-items-list');
    const summaryEl = document.getElementById('summary-items');
    const totalEl = document.getElementById('summary-total');

    if (!cart.length) {
      listEl.innerHTML = `<div class="empty-cart">
        <div style="font-size:4rem;margin-bottom:1rem;color:var(--text-muted);"><i class="fa fa-shopping-cart"></i></div>
        <h3 style="margin-bottom:0.5rem;">Your cart is empty</h3>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">Start adding products to your cart</p>
        <a href="catalog.html" class="btn btn-primary">Browse Products</a>
      </div>`;
      summaryEl.innerHTML = '';
      totalEl.textContent = '$0.00';
      return;
    }

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);
    listEl.innerHTML = cart.map(item=>`
      <div class="cart-item">
        <img src="${encodeURI(item.image||'')}" alt="${item.name}" onerror="this.style.display='none'"/>
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <div class="price">$${Number(item.price).toFixed(2)}</div>
          <div class="qty-control" style="margin-top:0.5rem;">
            <button class="qty-btn" onclick="changeQty('${item.id}',-1)"><i class="fa fa-minus" style="font-size:0.6rem;"></i></button>
            <span class="qty-num">${item.qty||1}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}',1)"><i class="fa fa-plus" style="font-size:0.6rem;"></i></button>
          </div>
        </div>
        <button class="cart-remove" onclick="removeFromCart('${item.id}');renderCart();" title="Remove"><i class="fa fa-trash"></i></button>
      </div>`).join('');

    summaryEl.innerHTML = cart.map(i=>`
      <div class="summary-row">
        <span style="font-size:0.85rem;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.name} Ãƒ&mdash;${i.qty||1}</span>
        <span>$${((i.qty||1)*i.price).toFixed(2)}</span>
      </div>`).join('');
    totalEl.textContent = `$${total.toFixed(2)}`;
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(i=>i.id===id);
    if (!item) return;
    item.qty = Math.max(1, (item.qty||1) + delta);
    saveCart(cart);
    renderCart();
  }
  async function submitOrder() {
    const cart = getCart();
    if (!cart.length) { showToast('âŒ Your cart is empty!','error'); return; }
    const name = document.getElementById('inq-name').value.trim();
    const email = document.getElementById('inq-email').value.trim();
    const payment = document.getElementById('inq-payment').value;
    const notes = document.getElementById('inq-notes').value.trim();

    // Shipping address fields
    const country = document.getElementById('inq-country').value;
    const street  = document.getElementById('inq-street').value.trim();
    const apt     = document.getElementById('inq-apt').value.trim();
    const city    = document.getElementById('inq-city').value.trim();
    const zip     = document.getElementById('inq-zip').value.trim();

    // Validate required fields
    if (!name || !email || !payment || !country || !street || !city || !zip) {
      if (!payment) {
        document.getElementById('pay-error').style.display = 'block';
        document.getElementById('pay-grid').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      showToast('\u274C Please fill in all required fields including shipping address.', 'error');
      return;
    }

    const shippingAddress = {
      country,
      street,
      apt: apt || null,
      city,
      zip
    };

    const btn = document.getElementById('place-order-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Submitting...';

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);

    // Save to Supabase
    const { data, error } = await supabase.from('orders').insert({
      user_id: null,
      user_name: name,
      user_email: email,
      items: cart,
      total_price: total,
      payment_method: payment,
      notes: notes,
      shipping_address: shippingAddress,
      status: 'pending'
    }).select();

    if (error || !data || !data.length) { 
      showToast('Ã¢ÂÅ’ Failed to save order. Please try again.','error'); 
      btn.disabled=false; 
      btn.innerHTML='<i class="fa fa-paper-plane"></i> Place Order'; 
      return; 
    }

    const orderId = data[0].id;

    clearCart();
    
    // Show success screen with Order ID immediately
    const container = document.querySelector('.cart-page');
    if (container) {
      container.innerHTML = `
        <div style="text-align: center; padding: 4rem 1rem; max-width: 600px; margin: 0 auto;">
          <div style="font-size: 4rem; color: var(--gold); margin-bottom: 1.5rem;"><i class="fa fa-check-circle"></i></div>
          <h2 style="font-size: 2rem; margin-bottom: 1rem;">Order Submitted!</h2>
          <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">Thank you, ${name}. Your order has been placed successfully.</p>
          
          <div style="background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">
            <p style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">Your Tracking ID</p>
            <div style="font-family: monospace; font-size: 1.5rem; color: var(--gold); font-weight: 700; word-break: break-all; margin-bottom: 1rem;" id="tracking-id-display">${orderId}</div>
            <button onclick="navigator.clipboard.writeText('${orderId}'); showToast('Tracking ID copied!', 'success');" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin: 0 auto;">
              <i class="fa fa-copy"></i> Copy ID
            </button>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem;">Please save this ID and the email address you used to track your order status on our tracking page.</p>
          </div>
          
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="track.html" class="btn btn-gold"><i class="fa fa-search"></i> Track Order Now</a>
            <a href="catalog.html" class="btn btn-outline">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    // Build email content
    const orderDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const itemList  = cart.map(i => `- ${i.name}  x${i.qty||1}  =  $${((i.qty||1)*i.price).toFixed(2)}`).join('\n');
    const shippingLine = [shippingAddress.street, shippingAddress.apt, shippingAddress.city, shippingAddress.zip, shippingAddress.country].filter(Boolean).join(', ');

    // 1. Store notification
    fetch(`https://formsubmit.co/ajax/${ORDER_EMAIL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: `New Order from ${name} - #${orderId.substring(0,8)}`,
        "Customer": name,
        "Email": email,
        "Payment Method": payment,
        "Order ID": orderId,
        "Order Date": orderDate,
        "Ship To": shippingLine,
        "Total": "$" + total.toFixed(2),
        "Items": itemList,
        "Notes": notes || 'None'
      })
    })
    .then(r => r.json())
    .then(result => {
      if (result.success === 'true' || result.success === true) {
        console.log('Store notification sent.');
      } else {
        console.warn('Store email warn:', result);
      }
    })
    .catch(e => console.error('Store notification failed:', e));

    // 2. Customer invoice email (CC'd back to customer via _cc)
    fetch(`https://formsubmit.co/ajax/${ORDER_EMAIL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: `Your Pokepluse Invoice - Order #${orderId.substring(0,8)}`,
        _cc: email,
        _replyto: ORDER_EMAIL,
        "Dear": `${name}, thank you for your order! Below is your invoice and order confirmation.`,
        "---ORDER DETAILS---": "---",
        "Invoice / Tracking ID": orderId,
        "Order Date": orderDate,
        "---ITEMS ORDERED---": "---",
        "Items": itemList,
        "Order Total": "$" + total.toFixed(2),
        "---DELIVERY INFO---": "---",
        "Payment Method": payment,
        "Shipping To": shippingLine,
        "Notes": notes || 'None',
        "---TRACK YOUR ORDER---": "---",
        "How to track your order": `Go to our website, click Track Order, and enter your Tracking ID.`,
        "Your Tracking ID": orderId,
        "---CONTACT SUPPORT---": "---",
        "Need help?": `Reply to this email or contact us. Please always include your Tracking ID.`
      })
    })
    .then(r => r.json())
    .then(result => {
      if (result.success === 'true' || result.success === true) {
        console.log('Customer invoice sent to', email);
      } else {
        console.warn('Customer invoice warn:', result);
      }
    })
    .catch(e => console.error('Customer invoice failed:', e));
  }

  // Fields left empty for customer to fill in

  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  renderCart();

  // Payment logo card picker
  function selectPay(card) {
    document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    document.getElementById('inq-payment').value = card.getAttribute('data-value');
    document.getElementById('pay-error').style.display = 'none';
  }
</script>
