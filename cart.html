<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart & Checkout — Pokepluse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .cart-page { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; align-items: start; padding: 8rem 2rem 4rem; max-width: 1100px; margin: 0 auto; }
    .cart-panel { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); overflow: hidden; }
    .cart-panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-glass); font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .cart-items-list { padding: 0.5rem 0; }
    .qty-control { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-glass); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .qty-btn:hover { background: var(--blue); border-color: var(--blue); }
    .qty-num { font-weight: 700; min-width: 20px; text-align: center; }
    .order-summary { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 1.5rem; position: sticky; top: 90px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; }
    .summary-row.total { border-top: 1px solid var(--border-glass); padding-top: 1rem; margin-top: 0.5rem; font-weight: 800; font-size: 1.1rem; }
    .summary-row.total span:last-child { color: var(--gold); }
    .empty-cart { text-align: center; padding: 4rem 2rem; }
    @media (max-width: 768px) { .cart-page { grid-template-columns: 1fr; padding: 6rem 1rem 3rem; } .order-summary { position: static; } }
  </style>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo"><img src="logo.jpeg" alt="Pokepluse" class="premium-logo-img"> <span class="premium-logo-text">Pokepluse</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="catalog.html">Shop</a></li>
    <li><a href="track.html">Track Order</a></li>
  </ul>
  <div class="nav-actions">
    <div class="custom-lang-selector">
      <div id="google_translate_element" style="display:none;"></div>
      <button class="lang-selector-btn" id="lang-selector-btn">
        <i class="fa fa-globe"></i> <span id="current-lang-label">EN</span> <i class="fa fa-chevron-down arrow"></i>
      </button>
      <div class="lang-dropdown">
        <a href="#" data-lang="en">🇬🇧 English</a>
        <a href="#" data-lang="fr">🇫🇷 Français</a>
        <a href="#" data-lang="es">🇪🇸 Español</a>
        <a href="#" data-lang="de">🇩🇪 Deutsch</a>
        <a href="#" data-lang="ja">🇯🇵 日本語</a>
        <a href="#" data-lang="zh-CN">🇨🇳 中文</a>
        <a href="#" data-lang="ko">🇰🇷 한국어</a>
      </div>
    </div>
    <a href="cart.html" class="cart-icon" style="color:var(--blue);">
      <i class="fa fa-shopping-bag"></i>
      <span class="cart-badge" id="cart-count" style="display:none;">0</span>
    </a>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
      <i class="fa fa-bars"></i>
    </button>
  </div>
</nav>

<div class="cart-page">
  <div>
    <div class="cart-panel">
      <div class="cart-panel-header">
        <span><i class="fa fa-shopping-bag" style="color:var(--blue);margin-right:0.5rem;"></i>Your Cart</span>
        <button onclick="clearCart();renderCart();" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;">Clear All</button>
      </div>
      <div class="cart-items-list" id="cart-items-list"></div>
    </div>
  </div>

  <div>
    <div class="order-summary">
      <h3 style="margin-bottom:1.25rem;font-size:1rem;">Order Summary</h3>
      <div id="summary-items"></div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summary-total">$0.00</span>
      </div>

      <div style="margin-top:1.5rem;">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" id="inq-name" placeholder="Full name"/>
        </div>
        <div class="form-group">
          <label>Your Email *</label>
          <input type="email" id="inq-email" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label>Payment Method *</label>
          <select id="inq-payment">
            <option value="">Select a method...</option>
            <option>Bank Transfer</option>
            <option>Zelle</option>
            <option>Crypto (Bitcoin/USDT)</option>
            <option>Apple Pay</option>
            <option>Credit Card</option>
          </select>
        <div class="form-group">
          <label>Additional Notes</label>
          <textarea id="inq-notes" rows="3" placeholder="Any special requests..."></textarea>
        </div>
        <button class="btn btn-gold" style="width:100%;justify-content:center;font-size:1rem;" id="place-order-btn" onclick="submitOrder()">
          <i class="fa fa-paper-plane"></i> Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cart.js"></script>
<script>
  const ORDER_EMAIL = 'pokemoncards328@gmail.com';

  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById('cart-items-list');
    const summaryEl = document.getElementById('summary-items');
    const totalEl = document.getElementById('summary-total');

    if (!cart.length) {
      listEl.innerHTML = `<div class="empty-cart">
        <div style="font-size:4rem;margin-bottom:1rem;">🛒</div>
        <h3 style="margin-bottom:0.5rem;">Your cart is empty</h3>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">Start adding products to your cart</p>
        <a href="catalog.html" class="btn btn-primary">Browse Products</a>
      </div>`;
      summaryEl.innerHTML = '';
      totalEl.textContent = '$0.00';
      return;
    }

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);
    listEl.innerHTML = cart.map(item=>`
      <div class="cart-item">
        <img src="${encodeURI(item.image||'')}" alt="${item.name}" onerror="this.style.display='none'"/>
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <div class="price">$${Number(item.price).toFixed(2)}</div>
          <div class="qty-control" style="margin-top:0.5rem;">
            <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
            <span class="qty-num">${item.qty||1}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
          </div>
        </div>
        <button class="cart-remove" onclick="removeFromCart('${item.id}');renderCart();" title="Remove"><i class="fa fa-trash"></i></button>
      </div>`).join('');

    summaryEl.innerHTML = cart.map(i=>`
      <div class="summary-row">
        <span style="font-size:0.85rem;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.name} ×${i.qty||1}</span>
        <span>$${((i.qty||1)*i.price).toFixed(2)}</span>
      </div>`).join('');
    totalEl.textContent = `$${total.toFixed(2)}`;
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(i=>i.id===id);
    if (!item) return;
    item.qty = Math.max(1, (item.qty||1) + delta);
    saveCart(cart);
    renderCart();
  }

  async function submitOrder() {
    const cart = getCart();
    if (!cart.length) { showToast('❌ Your cart is empty!','error'); return; }
    const name = document.getElementById('inq-name').value.trim();
    const email = document.getElementById('inq-email').value.trim();
    const payment = document.getElementById('inq-payment').value;
    const notes = document.getElementById('inq-notes').value.trim();
    if (!name||!email||!payment) { showToast('❌ Please fill in all required fields.','error'); return; }

    const btn = document.getElementById('place-order-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Submitting...';

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);

    // Save to Supabase
    const { data, error } = await supabase.from('orders').insert({
      user_id: null,
      user_name: name,
      user_email: email,
      items: cart,
      total_price: total,
      payment_method: payment,
      notes: notes,
      status: 'pending'
    }).select();

    if (error || !data || !data.length) { 
      showToast('❌ Failed to save order. Please try again.','error'); 
      btn.disabled=false; 
      btn.innerHTML='<i class="fa fa-paper-plane"></i> Place Order'; 
      return; 
    }

    const orderId = data[0].id;

    clearCart();
    
    // Show success screen with Order ID immediately
    const container = document.querySelector('.cart-container');
    if (container) {
      container.innerHTML = `
        <div style="text-align: center; padding: 4rem 1rem; max-width: 600px; margin: 0 auto;">
          <div style="font-size: 4rem; color: var(--gold); margin-bottom: 1.5rem;"><i class="fa fa-check-circle"></i></div>
          <h2 style="font-size: 2rem; margin-bottom: 1rem;">Order Submitted!</h2>
          <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">Thank you, ${name}. Your order has been placed successfully.</p>
          
          <div style="background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">
            <p style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">Your Tracking ID</p>
            <div style="font-family: monospace; font-size: 1.5rem; color: var(--gold); font-weight: 700; word-break: break-all; margin-bottom: 1rem;" id="tracking-id-display">${orderId}</div>
            <button onclick="navigator.clipboard.writeText('${orderId}'); showToast('Tracking ID copied!', 'success');" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin: 0 auto;">
              <i class="fa fa-copy"></i> Copy ID
            </button>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem;">Please save this ID and the email address you used to track your order status on our tracking page.</p>
          </div>
          
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="track.html" class="btn btn-gold"><i class="fa fa-search"></i> Track Order Now</a>
            <a href="catalog.html" class="btn btn-outline">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    // Build email content and send via FormSubmit API asynchronously in the background
    const itemList = cart.map(i=>`- ${i.name} x${i.qty||1} = $${((i.qty||1)*i.price).toFixed(2)}`).join('\n');
    
    fetch(`https://formsubmit.co/ajax/${ORDER_EMAIL}`, {
      method: "POST",
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        _subject: `New TCG Order from ${name} (Order ${orderId.substring(0,8)})`,
        Name: name,
        Email: email,
        "Payment Method": payment,
        "Order ID": orderId,
        "Total": "$" + total.toFixed(2),
        "Notes": notes || 'None',
        "Items Ordered": itemList
      })
    }).catch(e => console.error("Email notification failed", e));
  }

  // Pre-fill from auth
  supabase.auth.getUser().then(({data:{user}})=>{
    if (user) {
      document.getElementById('inq-email').value = user.email || '';
      supabase.from('profiles').select('full_name').eq('id',user.id).single().then(({data})=>{ if(data?.full_name) document.getElementById('inq-name').value = data.full_name; });
    }
  });

  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  renderCart();
</script>
<script src="js/translate.js"></script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
