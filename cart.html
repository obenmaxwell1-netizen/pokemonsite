<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart &amp; Checkout &ndash; Pokepluse</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .cart-page { display: grid; grid-template-columns: 1fr 360px; gap: 2rem; align-items: start; padding: 8rem 2rem 4rem; max-width: 1100px; margin: 0 auto; }
    .cart-panel { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); overflow: hidden; }
    .cart-panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-glass); font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .cart-items-list { padding: 0.5rem 0; }
    .qty-control { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-glass); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .qty-btn:hover { background: var(--blue); border-color: var(--blue); }
    .qty-num { font-weight: 700; min-width: 20px; text-align: center; }
    .order-summary { background: var(--bg-secondary); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); padding: 1.5rem; position: sticky; top: 90px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; }
    .summary-row.total { border-top: 1px solid var(--border-glass); padding-top: 1rem; margin-top: 0.5rem; font-weight: 800; font-size: 1.1rem; }
    .summary-row.total span:last-child { color: var(--gold); }
    .empty-cart { text-align: center; padding: 4rem 2rem; }
    @media (max-width: 768px) { .cart-page { grid-template-columns: 1fr; padding: 6rem 1rem 3rem; } .order-summary { position: static; } }

    /* === Payment Logo Card Picker === */
    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 480px) { .pay-grid { grid-template-columns: repeat(2, 1fr); } }
    .pay-card {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.7rem 0.9rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
      background: #fff;
      user-select: none;
    }
    .pay-card:hover {
      border-color: #D4AF37;
      background: #fffbf0;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(212,175,55,0.15);
    }
    .pay-card.selected {
      border-color: #D4AF37;
      background: #fffbf0;
      box-shadow: 0 0 0 3px rgba(212,175,55,0.25);
    }
    .pay-card.selected .pay-name { color: #92670a; font-weight: 700; }
    .pay-logo {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .pay-name {
      font-size: 0.82rem; font-weight: 600;
      color: #374151; line-height: 1.2;
    }
    .pay-card.selected::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free'; font-weight: 900;
      font-size: 0.7rem; color: #D4AF37;
      margin-left: auto;
    }
  </style>
  <link rel="icon" type="image/jpeg" href="logo.jpeg">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo"><img src="logo.jpeg" alt="Pokepluse" class="premium-logo-img"> <span class="premium-logo-text">Pokepluse</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="catalog.html">Shop</a></li>
    <li><a href="track.html">Track Order</a></li>
  </ul>
  <div class="nav-actions">
    <div class="custom-lang-selector">
      <div id="google_translate_element" style="display:none;"></div>
      <button class="lang-selector-btn" id="lang-selector-btn">
        <i class="fa fa-globe"></i> <span id="current-lang-label">EN</span> <i class="fa fa-chevron-down arrow"></i>
      </button>
      <div class="lang-dropdown">
        <a href="#" data-lang="en"><span class="lang-flag">GB</span> English</a>
        <a href="#" data-lang="fr"><span class="lang-flag">FR</span> Fran&ccedil;ais</a>
        <a href="#" data-lang="es"><span class="lang-flag">ES</span> Espa&ntilde;ol</a>
        <a href="#" data-lang="de"><span class="lang-flag">DE</span> Deutsch</a>
        <a href="#" data-lang="ja"><span class="lang-flag">JP</span> &#26085;&#26412;&#35486;</a>
        <a href="#" data-lang="zh-CN"><span class="lang-flag">CN</span> &#20013;&#25991;</a>
        <a href="#" data-lang="ko"><span class="lang-flag">KR</span> &#54620;&#44397;&#50612;</a>
      </div>
    </div>
    <a href="cart.html" class="cart-icon" style="color:var(--blue);">
      <i class="fa fa-shopping-bag"></i>
      <span class="cart-badge" id="cart-count" style="display:none;">0</span>
    </a>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
      <i class="fa fa-bars"></i>
    </button>
  </div>
</nav>

<div class="cart-page">
  <div>
    <div class="cart-panel">
      <div class="cart-panel-header">
        <span><i class="fa fa-shopping-bag" style="color:var(--blue);margin-right:0.5rem;"></i>Your Cart</span>
        <button onclick="clearCart();renderCart();" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.8rem;">Clear All</button>
      </div>
      <div class="cart-items-list" id="cart-items-list"></div>
    </div>
  </div>

  <div>
    <div class="order-summary">
      <h3 style="margin-bottom:1.25rem;font-size:1rem;">Order Summary</h3>
      <div id="summary-items"></div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="summary-total">$0.00</span>
      </div>

      <div style="margin-top:1.5rem;">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" id="inq-name" placeholder="Full name"/>
        </div>
        <div class="form-group">
          <label>Your Email *</label>
          <input type="email" id="inq-email" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            Payment Method *
            <span style="font-size:0.72rem; font-weight:500; color:#fff; background:linear-gradient(135deg,#D4AF37,#b8860b); padding:0.25rem 0.65rem; border-radius:20px; letter-spacing:0.3px; white-space:nowrap;">
              <i class="fa fa-envelope" style="margin-right:4px;"></i>All payment details will be sent via email
            </span>
          </label>
          <!-- Hidden input used by JS -->
          <input type="hidden" id="inq-payment" value=""/>
          <!-- Custom payment logo picker -->
          <div class="pay-grid" id="pay-grid">

            <div class="pay-card" data-value="Bank Transfer" onclick="selectPay(this)">
              <div class="pay-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect width="24" height="24" rx="5" fill="#1a56db"/>
                  <path d="M4 10h16M4 14h16M12 4l8 6H4l8-6z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <rect x="5" y="14" width="2" height="4" fill="#fff"/>
                  <rect x="11" y="14" width="2" height="4" fill="#fff"/>
                  <rect x="17" y="14" width="2" height="4" fill="#fff"/>
                  <rect x="4" y="18" width="16" height="1.5" rx="0.5" fill="#fff"/>
                </svg>
              </div>
              <span class="pay-name">Bank Transfer</span>
            </div>

            <div class="pay-card" data-value="Zelle" onclick="selectPay(this)">
              <div class="pay-logo">
                <svg width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <rect width="48" height="48" rx="10" fill="#6D1ED4"/>
                  <text x="24" y="33" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="24" fill="#fff">Z</text>
                </svg>
              </div>
              <span class="pay-name">Zelle</span>
            </div>

            <div class="pay-card" data-value="Wise" onclick="selectPay(this)">
              <div class="pay-logo">
                <svg width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <rect width="48" height="48" rx="10" fill="#9FE870"/>
                  <polygon points="10,14 22,14 28,34 36,14 44,14 32,38 24,38 18,26 12,38 4,38" fill="#163300"/>
                </svg>
              </div>
              <span class="pay-name">Wise</span>
            </div>

            <div class="pay-card" data-value="Google Pay" onclick="selectPay(this)">
              <div class="pay-logo" style="background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:3px;">
                <svg width="32" height="20" viewBox="0 0 80 32" xmlns="http://www.w3.org/2000/svg">
                  <text y="24" font-family="Arial" font-size="22" font-weight="bold">
                    <tspan fill="#4285F4">G</tspan><tspan fill="#34A853">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#EA4335">g</tspan><tspan fill="#4285F4">le</tspan>
                  </text>
                  <text x="47" y="24" font-family="Arial" font-size="22" font-weight="bold" fill="#5f6368">Pay</text>
                </svg>
              </div>
              <span class="pay-name">Google Pay</span>
            </div>

            <div class="pay-card" data-value="Apple Pay" onclick="selectPay(this)">
              <div class="pay-logo" style="background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; width:54px; height:34px;">
                <svg width="36" height="22" viewBox="0 0 80 32" xmlns="http://www.w3.org/2000/svg">
                  <text y="24" font-family="Arial" font-size="18" font-weight="600" fill="#fff">&#xf8ff; Pay</text>
                </svg>
              </div>
              <span class="pay-name">Apple Pay</span>
            </div>

            <div class="pay-card" data-value="Crypto (Bitcoin/USDT)" onclick="selectPay(this)">
              <div class="pay-logo">
                <svg width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <rect width="48" height="48" rx="10" fill="#F7931A"/>
                  <text x="24" y="34" text-anchor="middle" font-family="Arial Black" font-size="26" font-weight="900" fill="#fff">&#x20BF;</text>
                </svg>
              </div>
              <span class="pay-name">Crypto</span>
            </div>

            <div class="pay-card" data-value="Credit Card" onclick="selectPay(this)">
              <div class="pay-logo">
                <svg width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <rect width="48" height="48" rx="10" fill="#1f2937"/>
                  <rect x="5" y="13" width="38" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
                  <rect x="5" y="19" width="38" height="6" fill="#D4AF37"/>
                  <rect x="8" y="29" width="10" height="3" rx="1" fill="#fff"/>
                  <rect x="21" y="29" width="6" height="3" rx="1" fill="rgba(255,255,255,0.5)"/>
                </svg>
              </div>
              <span class="pay-name">Credit Card</span>
            </div>

          </div>
          <div id="pay-error" style="display:none; color:#ef4444; font-size:0.8rem; margin-top:0.4rem;"><i class="fa fa-exclamation-circle"></i> Please select a payment method.</div>
        </div>

        <div class="form-group">
          <label>Additional Notes</label>
          <textarea id="inq-notes" rows="3" placeholder="Any special requests..."></textarea>
        </div>
        <button class="btn btn-gold" style="width:100%;justify-content:center;font-size:1rem;" id="place-order-btn" onclick="submitOrder()">
          <i class="fa fa-paper-plane"></i> Place Order
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cart.js"></script>
<script>
  const ORDER_EMAIL = 'contact@pokepluse.com';

  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById('cart-items-list');
    const summaryEl = document.getElementById('summary-items');
    const totalEl = document.getElementById('summary-total');

    if (!cart.length) {
      listEl.innerHTML = `<div class="empty-cart">
        <div style="font-size:4rem;margin-bottom:1rem;color:var(--text-muted);"><i class="fa fa-shopping-cart"></i></div>
        <h3 style="margin-bottom:0.5rem;">Your cart is empty</h3>
        <p style="color:var(--text-muted);margin-bottom:1.5rem;">Start adding products to your cart</p>
        <a href="catalog.html" class="btn btn-primary">Browse Products</a>
      </div>`;
      summaryEl.innerHTML = '';
      totalEl.textContent = '$0.00';
      return;
    }

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);
    listEl.innerHTML = cart.map(item=>`
      <div class="cart-item">
        <img src="${encodeURI(item.image||'')}" alt="${item.name}" onerror="this.style.display='none'"/>
        <div class="cart-item-info">
          <h4>${item.name}</h4>
          <div class="price">$${Number(item.price).toFixed(2)}</div>
          <div class="qty-control" style="margin-top:0.5rem;">
            <button class="qty-btn" onclick="changeQty('${item.id}',-1)"><i class="fa fa-minus" style="font-size:0.6rem;"></i></button>
            <span class="qty-num">${item.qty||1}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}',1)"><i class="fa fa-plus" style="font-size:0.6rem;"></i></button>
          </div>
        </div>
        <button class="cart-remove" onclick="removeFromCart('${item.id}');renderCart();" title="Remove"><i class="fa fa-trash"></i></button>
      </div>`).join('');

    summaryEl.innerHTML = cart.map(i=>`
      <div class="summary-row">
        <span style="font-size:0.85rem;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.name} Ã&mdash;${i.qty||1}</span>
        <span>$${((i.qty||1)*i.price).toFixed(2)}</span>
      </div>`).join('');
    totalEl.textContent = `$${total.toFixed(2)}`;
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(i=>i.id===id);
    if (!item) return;
    item.qty = Math.max(1, (item.qty||1) + delta);
    saveCart(cart);
    renderCart();
  }

  async function submitOrder() {
    const cart = getCart();
    if (!cart.length) { showToast('âŒ Your cart is empty!','error'); return; }
    const name = document.getElementById('inq-name').value.trim();
    const email = document.getElementById('inq-email').value.trim();
    const payment = document.getElementById('inq-payment').value;
    const notes = document.getElementById('inq-notes').value.trim();
    if (!name||!email||!payment) {
      if (!payment) {
        document.getElementById('pay-error').style.display = 'block';
        document.getElementById('pay-grid').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      showToast('\u274C Please fill in all required fields.', 'error');
      return;
    }

    const btn = document.getElementById('place-order-btn');
    btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Submitting...';

    const total = cart.reduce((s,i)=>s+((i.qty||1)*i.price),0);

    // Save to Supabase
    const { data, error } = await supabase.from('orders').insert({
      user_id: null,
      user_name: name,
      user_email: email,
      items: cart,
      total_price: total,
      payment_method: payment,
      notes: notes,
      status: 'pending'
    }).select();

    if (error || !data || !data.length) { 
      showToast('âŒ Failed to save order. Please try again.','error'); 
      btn.disabled=false; 
      btn.innerHTML='<i class="fa fa-paper-plane"></i> Place Order'; 
      return; 
    }

    const orderId = data[0].id;

    clearCart();
    
    // Show success screen with Order ID immediately
    const container = document.querySelector('.cart-page');
    if (container) {
      container.innerHTML = `
        <div style="text-align: center; padding: 4rem 1rem; max-width: 600px; margin: 0 auto;">
          <div style="font-size: 4rem; color: var(--gold); margin-bottom: 1.5rem;"><i class="fa fa-check-circle"></i></div>
          <h2 style="font-size: 2rem; margin-bottom: 1rem;">Order Submitted!</h2>
          <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">Thank you, ${name}. Your order has been placed successfully.</p>
          
          <div style="background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">
            <p style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;">Your Tracking ID</p>
            <div style="font-family: monospace; font-size: 1.5rem; color: var(--gold); font-weight: 700; word-break: break-all; margin-bottom: 1rem;" id="tracking-id-display">${orderId}</div>
            <button onclick="navigator.clipboard.writeText('${orderId}'); showToast('Tracking ID copied!', 'success');" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin: 0 auto;">
              <i class="fa fa-copy"></i> Copy ID
            </button>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.5rem;">Please save this ID and the email address you used to track your order status on our tracking page.</p>
          </div>
          
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="track.html" class="btn btn-gold"><i class="fa fa-search"></i> Track Order Now</a>
            <a href="catalog.html" class="btn btn-outline">Continue Shopping</a>
          </div>
        </div>
      `;
    }

    // Build email content and send via FormSubmit API asynchronously in the background
    const itemList = cart.map(i=>`- ${i.name} x${i.qty||1} = $${((i.qty||1)*i.price).toFixed(2)}`).join('\n');
    
    fetch(`https://formsubmit.co/ajax/${ORDER_EMAIL}`, {
      method: "POST",
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        _subject: `New TCG Order from ${name} (Order ${orderId.substring(0,8)})`,
        Name: name,
        Email: email,
        "Payment Method": payment,
        "Order ID": orderId,
        "Total": "$" + total.toFixed(2),
        "Notes": notes || 'None',
        "Items Ordered": itemList
      })
    }).catch(e => console.error("Email notification failed", e));
  }

  // Fields left empty for customer to fill in

  // Mobile Menu Toggle
  const mobileMenuBtn = document.getElementById('mobile-menu-btn');
  const navLinks = document.querySelector('.nav-links');
  if (mobileMenuBtn && navLinks) {
    mobileMenuBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  }

  renderCart();

  // Payment logo card picker
  function selectPay(card) {
    document.querySelectorAll('.pay-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    document.getElementById('inq-payment').value = card.getAttribute('data-value');
    document.getElementById('pay-error').style.display = 'none';
  }
</script>
